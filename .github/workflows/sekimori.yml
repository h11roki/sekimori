name: sekimori

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sekimori
        uses: h11roki/sekimori@de939eae8f92c2d9d97204ce4f7a1332415ad818 # v0.1.0
      - if: always() && steps.sekimori.outputs.sarif-file != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.sekimori.outputs.sarif-file }}
          category: sekimori
