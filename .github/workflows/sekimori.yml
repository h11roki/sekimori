name: sekimori

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sekimori
        uses: h11roki/sekimori@aebcc19a2eebf8db563bc6bbef6e1e9c5cb8168e # v0.16.0
      - if: >-
          !cancelled()
          && steps.sekimori.outputs.sarif-file != ''
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.sekimori.outputs.sarif-file }}
          category: sekimori

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      released: ${{ steps.release.outputs.released }}
      check-run-id: ${{ job.check_run_id }}
      annotations: ${{ steps.verify.outputs.annotations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::could not read the version from Cargo.toml"
            exit 1
          fi
          if response=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "released=true" >> "$GITHUB_OUTPUT"
          elif grep -qx "release not found" <<< "$response"; then
            echo "::notice::v$version is not released yet, so the action in this commit is not run"
          else
            echo "$response"
            exit 1
          fi
      - id: findings
        if: steps.release.outputs.released == 'true'
        continue-on-error: true
        uses: $/
        with:
          paths: |
            tests/fixtures/findings/open-claude.yml
            tests/fixtures/findings/open-codex.yml
      - id: verify
        if: steps.release.outputs.released == 'true'
        env:
          OUTCOME: ${{ steps.findings.outcome }}
          EXIT_CODE: ${{ steps.findings.outputs.exit-code }}
          SARIF: ${{ steps.findings.outputs.sarif-file }}
        run: |
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 1
          jq -e '.runs[0].invocations[0].executionSuccessful' "$SARIF"
          jq -e '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri] | unique == ["tests/fixtures/findings/open-claude.yml", "tests/fixtures/findings/open-codex.yml"]' "$SARIF"
          annotations=$(jq -c '[.runs[0].results[] | .locations[0].physicalLocation as $location | [$location.artifactLocation.uri, $location.region.startLine, $location.region.startColumn, (if .level == "error" then "failure" else .level end), "sekimori " + .ruleId, .message.text]] | sort' "$SARIF")
          if ! jq -e -n --argjson annotations "$annotations" '[$annotations | group_by(.[3])[] | length] | all(. <= 10)' > /dev/null; then
            echo "::error::the fixtures give more than 10 annotations of one level, and GitHub keeps only 10 per step"
            exit 1
          fi
          echo "annotations=$annotations" >> "$GITHUB_OUTPUT"

  action-annotations:
    needs: action
    if: needs.action.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ needs.action.outputs.check-run-id }}
          EXPECTED: ${{ needs.action.outputs.annotations }}
        run: |
          if [ -z "$CHECK_RUN_ID" ]; then
            echo "::error::the action job did not give its check run ID"
            exit 1
          fi
          actual=""
          for delay in 0 5 5 5 5 5; do
            sleep "$delay"
            if response=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID/annotations?per_page=100" --jq '[.[] | select((.title // "") | test("^sekimori( |$)")) | [.path, .start_line, .start_column, .annotation_level, .title, .message]] | sort'); then
              actual=$response
              if jq -e -n --argjson expected "$EXPECTED" --argjson actual "$actual" '$expected == $actual' > /dev/null; then
                exit 0
              fi
            fi
          done
          if [ -z "$actual" ]; then
            echo "::error::could not read the annotations of the action job"
            exit 1
          fi
          echo "::error::the annotations of the action job do not match its SARIF results"
          diff <(jq -c '.[]' <<< "$EXPECTED") <(jq -c '.[]' <<< "$actual") || true
          exit 1
