name: sekimori

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sekimori
        uses: h11roki/sekimori@68892dc99b538f63a843e57aead2a72bf45c30ca # v0.2.0
      - if: >-
          !cancelled()
          && steps.sekimori.outputs.sarif-file != ''
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.sekimori.outputs.sarif-file }}
          category: sekimori

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::could not read the version from Cargo.toml"
            exit 1
          fi
          if response=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "released=true" >> "$GITHUB_OUTPUT"
          elif grep -qx "release not found" <<< "$response"; then
            echo "::notice::v$version is not released yet, so the action in this commit is not run"
          else
            echo "$response"
            exit 1
          fi
      - id: findings
        if: steps.release.outputs.released == 'true'
        continue-on-error: true
        uses: $/
        with:
          paths: |
            tests/fixtures/findings/open-claude.yml
            tests/fixtures/findings/open-codex.yml
      - if: steps.release.outputs.released == 'true'
        env:
          OUTCOME: ${{ steps.findings.outcome }}
          SARIF: ${{ steps.findings.outputs.sarif-file }}
        run: |
          test "$OUTCOME" = failure
          jq -e '.runs[0].invocations[0].executionSuccessful' "$SARIF"
          jq -e '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri] | unique == ["tests/fixtures/findings/open-claude.yml", "tests/fixtures/findings/open-codex.yml"]' "$SARIF"
