name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sekimori") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
    env:
      TARGET: ${{ matrix.target }}
      ASSET: sekimori-${{ matrix.target }}${{ matrix.suffix }}
      BINARY: target/${{ matrix.target }}/release/sekimori${{ matrix.suffix }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - run: rustup target add "$TARGET"
      - run: cargo build --release --locked --target "$TARGET"
      - run: cp "$BINARY" "$ASSET"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - run: gh release upload "$GITHUB_REF_NAME" "$ASSET" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
