[package]
name = "sekimori"
version = "0.1.0"
edition = "2024"
description = "Static analysis for GitHub Actions workflows that run AI coding agents"
license = "MIT"
repository = "https://github.com/h11roki/sekimori"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
github-actions-models = "=1.32.0"
thiserror = "2"
yaml_serde = "0.10"
yamlpath = "=1.32.0"

[dev-dependencies]
tempfile = "3.27.0"
